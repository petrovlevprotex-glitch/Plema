<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>System Locked</title>
<style>
  body { margin: 0; background: #000; color: red; font-family: monospace; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; user-select: none; overflow: hidden; }
  h1 { font-size: 2.5em; animation: blink 1s infinite; margin-bottom: 10px; }
  p { font-size: 1.2em; color: #fff; margin: 10px; }
  .tg { color: #ffcc00; font-weight: bold; font-size: 1.5em; margin: 15px 0; }
  input { padding: 15px; font-size: 1.2em; margin: 20px 0; border: 2px solid red; background: #111; color: #fff; text-align: center; width: 80%; max-width: 300px; outline: none; }
  button { padding: 15px 40px; font-size: 1.2em; background: red; color: white; border: none; font-weight: bold; }
  #status { color: #ff0000; margin-top: 20px; font-size: 1.1em; font-weight: bold; }
  .success { color: #00ff00 !important; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body onclick="initApp()">
  <h1>СИСТЕМА ЗАБЛОКИРОВАНА</h1>
  <p>Все данные зашифрованы.</p>
  <div class="tg">ОТКУП: @lev_petrov</div>
  
  <input type="text" id="password" placeholder="Ключ дешифровки...">
  <br>
  <button onclick="check()">РАЗБЛОКИРОВАТЬ</button>
  <div id="status"></div>

  <script>
    let tg = window.Telegram.WebApp;
    let isInit = false;

    function initApp() {
        if (isInit) return;
        isInit = true;
        if (tg) {
            tg.expand();
            if (tg.requestFullscreen) tg.requestFullscreen();
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
            if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
        }
    }
    initApp();

    function check() {
        let pwd = document.getElementById('password').value;
        let status = document.getElementById('status');

        if (pwd === "5680") {
            status.innerText = "ДОСТУП РАЗРЕШЕН. СИСТЕМА ВОССТАНОВЛЕНА.";
            status.className = "success";
            document.body.innerHTML = '<h1 class="success" style="animation: none;">РАЗБЛОКИРОВАНО</h1><p>Пароль верный.</p>';
            if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
        } else {
            status.innerText = "ДОСТУП ЗАПРЕЩЕН.";
            status.className = "";
        }
    }
  </script>
</body>
</html>
